[package]
name = "sapling-rust"
version = "0.1.0"
edition = "2021"

# Zero dependencies: sapling_rust.dll ships only the parity-verified distance-band primitive.
[dependencies]

[features]
# Deliberately breaks the band direction gates so the differential harness can
# prove it detects real defects (mutation test). Never enable in a shipped build.
mutate = []

[lib]
name = "sapling_rust"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[lints.clippy]
perf = { level = "deny", priority = -1 }
redundant_clone = "deny"
